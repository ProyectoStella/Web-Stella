<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Centro de Documentación Técnica del proyecto STELLA: informes, manuales, presentaciones, carpetas de campo y más.">
<meta name="theme-color" content="#0a0a1a">
<meta property="og:title" content="Documentación | STELLA">
<meta property="og:description" content="Biblioteca técnica del proyecto STELLA con documentos organizados por categoría.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://stellaproject.com.ar/assets/images/og-portada.png">
<link rel="canonical" href="https://stellaproject.com.ar/pages/documentacion.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="../assets/images/Logo.png">
<title>Documentación | STELLA</title>
<link rel="stylesheet" href="../css/base/reset.css?v=18">
<link rel="stylesheet" href="../css/base/background.css?v=18">
<link rel="stylesheet" href="../css/components/navbar.css?v=18">
<link rel="stylesheet" href="../css/components/footer.css?v=18">
<link rel="stylesheet" href="../css/components/section.css?v=18">
<link rel="stylesheet" href="../css/components/skeleton.css?v=18">
<link rel="stylesheet" href="../css/components/breadcrumb.css?v=18">
<link rel="stylesheet" href="../css/pages/documentacion.css?v=18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="../assets/backgrounds/fototierra.jpg" fetchpriority="high">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div id="breadcrumb"></div>

<main>
    <section class="page-section" id="documentacion">
        <h1>Documentación</h1>
        <p class="subtitle">Biblioteca técnica del proyecto STELLA</p>

        <div class="doc-estadisticas" id="doc-estadisticas">
            <div class="doc-stat-item"><span class="doc-stat-num">...</span><span class="doc-stat-label">Documentos</span></div>
            <div class="doc-stat-item"><span class="doc-stat-num">...</span><span class="doc-stat-label">Categorías</span></div>
            <div class="doc-stat-item"><span class="doc-stat-num">...</span><span class="doc-stat-label">...</span></div>
            <div class="doc-stat-item"><span class="doc-stat-num">...</span><span class="doc-stat-label">...</span></div>
        </div>

        <div class="doc-filtros" id="doc-filtros"></div>

        <div class="doc-controls">
            <div class="doc-search-wrapper">
                <input type="text" class="doc-search" id="doc-search" placeholder="Buscar por título, categoría o descripción...">
            </div>
            <select class="doc-orden-select" id="doc-orden">
                <option value="recientes">Más recientes</option>
                <option value="antiguos">Más antiguos</option>
                <option value="alfabetico">Orden alfabético</option>
            </select>
        </div>

        <div class="doc-destacados" id="doc-destacados">
            <h3>Documentos destacados</h3>
        </div>

        <div class="doc-grid" id="documentos-container">
            <div class="doc-skeleton-inner">
                <div style="height:180px;background:rgba(79,195,247,0.06);border-radius:12px 12px 0 0;animation:skeleton-pulse 1.5s ease-in-out infinite;"></div>
                <div class="skeleton-line" style="width:35%;margin-top:18px;"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line" style="width:60%;"></div>
                <div class="skeleton-line" style="width:40%;height:30px;margin-top:16px;"></div>
            </div>
            <div class="doc-skeleton-inner">
                <div style="height:180px;background:rgba(79,195,247,0.06);border-radius:12px 12px 0 0;animation:skeleton-pulse 1.5s ease-in-out infinite;"></div>
                <div class="skeleton-line" style="width:35%;margin-top:18px;"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line" style="width:60%;"></div>
                <div class="skeleton-line" style="width:40%;height:30px;margin-top:16px;"></div>
            </div>
            <div class="doc-skeleton-inner">
                <div style="height:180px;background:rgba(79,195,247,0.06);border-radius:12px 12px 0 0;animation:skeleton-pulse 1.5s ease-in-out infinite;"></div>
                <div class="skeleton-line" style="width:35%;margin-top:18px;"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line" style="width:60%;"></div>
                <div class="skeleton-line" style="width:40%;height:30px;margin-top:16px;"></div>
            </div>
        </div>
    </section>
</main>

<div id="footer"></div>

<div class="pdf-modal" id="pdf-modal" role="dialog" aria-modal="true" aria-label="Vista previa del documento">
    <div class="pdf-modal-contenido">
        <div class="pdf-modal-header">
            <h3 id="pdf-modal-titulo"></h3>
            <div class="pdf-modal-acciones">
                <a href="#" class="doc-btn doc-btn-sm" id="pdf-modal-download" download>Descargar</a>
                <button class="pdf-modal-cerrar" id="pdf-modal-cerrar" aria-label="Cerrar vista previa">&times;</button>
            </div>
        </div>
        <iframe class="pdf-modal-viewer" id="pdf-viewer" src="" title="Vista previa del documento"></iframe>
    </div>
</div>

<script src="../js/utils/constants.js?v=18"></script>
<script src="../js/utils/helpers.js?v=18"></script>
<script src="../js/utils/iconos.js?v=18"></script>
<script src="../js/components/navbar.js?v=18"></script>
<script src="../js/components/breadcrumb.js?v=18"></script>
<script src="../js/components/footer.js?v=18"></script>
<script src="../js/pages/documentacion.js?v=18"></script>
</body>
</html>

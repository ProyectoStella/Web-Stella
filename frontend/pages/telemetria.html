<link rel="canonical" href="https://stellaproject.com.ar/pages/telemetria.html">

<link rel="icon" type="image/png" href="../assets/images/Logo.png">

<link rel="stylesheet" href="../css/base/reset.css?v=18">
<link rel="stylesheet" href="../css/base/background.css?v=18">
<link rel="stylesheet" href="../css/components/navbar.css?v=18">
<link rel="stylesheet" href="../css/components/footer.css?v=18">
<link rel="stylesheet" href="../css/components/section.css?v=18">

<body>

<div id="navbar"></div>

<div id="breadcrumb"></div>

<main>
    <section class="page-section" id="datos">
        <h1>Telemetría en Vivo</h1>
        <p class="subtitle">Vista del sistema de telemetría desarrollado por el proyecto (datos de prueba)</p>

        <div class="cards">
            <div class="card">
                <h3>Temperatura</h3>
                <p id="temp">--</p>
                <span class="label">°C</span>
            </div>
            <div class="card">
                <h3>Presión</h3>
                <p id="presion">--</p>
                <span class="label">hPa</span>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-wrapper">
                <canvas id="chart-temp"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="chart-pres"></canvas>
            </div>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
